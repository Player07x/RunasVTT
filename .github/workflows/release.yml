name: Release

# Uma tag `v<versão>` (criada por `npm version`) gera o instalador Windows e o
# publica numa Release do GitHub (ADR 0018). Rodar manualmente pela aba Actions
# só gera o instalador como artefato do workflow, sem criar Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Conferir a tag com a versão do package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::A tag $GITHUB_REF_NAME não corresponde à versão $expected do package.json. Use npm version."
            exit 1
          fi

      - run: npm run typecheck
      - run: npm test

      # Cópia inicial dos três sites que vai dentro do instalador (ADR 0016).
      # Também faz o build da pasta out/ usada pelos passos seguintes.
      - name: Cópia inicial dos sites
        run: npm run seed:sites

      - name: Smoke no Electron
        run: npx electron . --smoke

      - name: Gerar o instalador
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Somas SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter "RunasVTT-Setup-*.exe" |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: RunasVTT-windows
          path: |
            dist/RunasVTT-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publicar a Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/RunasVTT-Setup-*.exe dist/SHA256SUMS.txt \
            --title "RunasVTT $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
